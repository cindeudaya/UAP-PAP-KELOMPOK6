<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bantu Pengobatan Adik Rafa - Kebaikan Digital</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', sans-serif; 
        }
        body { 
            background-color: #ffffff; 
            color: #222222; 
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 24px; 
        }

        /* NAVBAR */
        .navbar { 
            background-color: #eff6f2; 
            padding: 18px 0; 
            border-bottom: 1px solid #e0eae4; 
            width: 100%; 
        }
        .nav-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .logo { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-weight: bold; 
            color: #11693e; 
            font-size: 20px; 
        }
        .logo img { 
            width: 36px; 
            height: 36px; 
            object-fit: contain; 
        }
        .nav-links { 
            display: flex; 
            align-items: center; 
            margin-left: auto; 
            margin-right: 40px; 
        }
        .nav-links a { 
            text-decoration: none; 
            color: #000000; 
            margin: 0 18px; 
            font-weight: bold; 
            font-size: 15px; 
        }
        .nav-links a.active { 
            color: #11693e; 
        }

        .auth-buttons { 
            display: flex; 
            gap: 12px; 
        }
        .btn-masuk { 
            background: white; 
            border: 1.5px solid #11693e; 
            color: #11693e; 
            padding: 10px 28px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 15px; 
            transition: all 0.2s;
        }
        .btn-masuk:hover {
            background: #f0f6f3;
        }
        .btn-daftar { 
            background: #11693e; 
            border: none; 
            color: white; 
            padding: 10px 28px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 15px; 
            transition: all 0.2s;
        }
        .btn-daftar:hover {
            background: #0f5935;
        }

        /* CONTENT KATALOG */
        .campaign-section { 
            margin-top: 40px; 
            margin-bottom: 60px; 
        }
        .header-title h1 { 
            font-size: 32px; 
            font-weight: bold; 
            color: #1f1f1f; 
        }
        .header-title p { 
            color: #666; 
            margin-top: 8px; 
            font-size: 15px; 
        }
        .filter-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin: 30px 0; 
        }
        .categories-tabs { 
            display: flex; 
            gap: 12px; 
        }
        .tab-item { 
            background-color: #c4c4c4; 
            color: #333; 
            border: none; 
            padding: 10px 22px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px; 
        }
        .tab-item.active { 
            background-color: #9ac2b1; 
            color: #11693e; 
        }
        .btn-filter { 
            background: white; 
            border: 1.5px solid #ccc; 
            padding: 10px 22px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            color: #333; 
        }
        .campaign-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 24px; 
        }
        .campaign-card { 
            background: white; 
            border: 1px solid #eaeaea; 
            border-radius: 12px; 
            overflow: hidden; 
            cursor: pointer; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
            transition: transform 0.2s; 
        }
        .campaign-card:hover { 
            transform: translateY(-4px); 
        }
        .card-image { 
            height: 170px; 
            width: 100%; 
        }
        .card-image img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        .card-content { 
            padding: 18px; 
        }
        .card-title { 
            font-size: 16px; 
            font-weight: bold; 
            color: #111; 
            margin-bottom: 12px; 
        }
        .card-funding { 
            display: flex; 
            align-items: baseline; 
            gap: 6px; 
            margin-bottom: 10px; 
        }
        .raised { 
            color: #11693e; 
            font-weight: bold; 
            font-size: 16px; 
        }
        .label-raised { 
            font-size: 11px; 
            color: #888; 
        }
        .progress-container { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 10px; 
            margin-bottom: 12px; 
        }
        .progress-bar-bg { 
            background: #e0e0e0; 
            height: 6px; 
            border-radius: 3px; 
            flex-grow: 1; 
        }
        .progress-bar-fill { 
            background: #11693e; 
            height: 100%; 
            width: 75%; 
            border-radius: 3px; 
        }
        .progress-text { 
            font-size: 12px; 
            font-weight: bold; 
            color: #555; 
        }
        .days-left { 
            font-size: 12px; 
            color: #11693e; 
            font-weight: 500; 
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container nav-container">
            <div class="logo">
                <img src="logo  1.png" alt="Kebaikan Digital">
                <span>Kebaikan Digital</span>
            </div>
            <nav class="nav-links">
                <a href="#">Beranda</a>
                <a href="#" class="active">Campaign</a>
                <a href="#">Event</a>
                <a href="#">Tentang Kami</a>
            </nav>
            <div class="auth-buttons">
                <button class="btn-masuk">Masuk</button>
                <button class="btn-daftar">Daftar</button>
            </div>
        </div>
    </header>

    <main class="container campaign-section">
        <div class="header-title">
            <h1>Bantu Pengobatan Adik Rafa</h1>
            <p>Temukan berbagai campaign kebaikan yang sedang berjalan.</p>
        </div>

        <div class="filter-container">
            <div class="categories-tabs">
                <button class="tab-item" onclick="filterKategori('semua', this)">Semua</button>
                <button class="tab-item active" onclick="filterKategori('kesehatan', this)">Kesehatan</button>
                <button class="tab-item" onclick="filterKategori('pendidikan', this)">Pendidikan</button>
                <button class="tab-item" onclick="filterKategori('kemanusiaan', this)">Kemanusiaan</button>
                <button class="tab-item" onclick="filterKategori('lingkungan', this)">Lingkungan</button>
            </div>
            <button class="btn-filter">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line>
                    <line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line>
                    <line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line>
                    <line x1="17" y1="16" x2="23" y2="16"></line>
                </svg>
                Filter
            </button>
        </div>

        <div class="campaign-grid">
            <script>
                for(let i = 0; i < 8; i++) {
                    document.write(`
                    <div class="campaign-card" onclick="keHalamanDetail()">
                        <div class="card-image"><img src="Rectangle 33.png" alt="Rafa"></div>
                        <div class="card-content">
                            <h3 class="card-title">Bantu Pengobatan Adik Rafa</h3>
                            <div class="card-funding"><span class="raised">Rp 7.500.000</span><span class="label-raised">Terkumpul</span></div>
                            <div class="progress-container">
                                <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
                                <span class="progress-text">75%</span>
                            </div>
                            <p class="days-left">12 hari lagi</p>
                        </div>
                    </div>
                    `);
                }
            </script>
        </div>
    </main>

    <script>
        function keHalamanDetail() { 
            window.location.href = 'campaign-detail.html'; 
        }

        function filterKategori(kategori, element) {
            const tabs = document.querySelectorAll('.tab-item');
            tabs.forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
